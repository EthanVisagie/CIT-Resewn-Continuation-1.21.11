name: build

on:
  push:
    branches:
      - main
      - port/26.2
  pull_request:
  workflow_dispatch:

jobs:
  build-26-2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build active version
        run: ./gradlew buildActive --no-daemon --console=plain

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: citresewn-continuation-26.2
          path: |
            versions/26.2/build/libs/*.jar
            defaults/versions/26.2/build/libs/*.jar
